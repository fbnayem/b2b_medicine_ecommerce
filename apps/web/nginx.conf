# Static hosting for the built web application.
#
# The API sets its own headers; these cover the documents nginx serves, which
# are the ones a browser will execute. The two must agree, because a permissive
# policy here would undo the strict one there for anything same-origin.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  # Compression is terminated here rather than in Node: nginx does it without
  # occupying an event loop that has transactions to run.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), microphone=(), payment=()" always;
  # `connect-src` includes websockets because the realtime channel is a
  # first-party connection to the same origin through the proxy below.
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

  # Fingerprinted assets are immutable; the entry document must never be, or a
  # release would keep serving the previous bundle from a browser cache.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }

  location = /index.html {
    add_header Cache-Control "no-store" always;
  }

  # Same-origin API and realtime, so the browser sends no cross-site request and
  # the refresh cookie's SameSite=Strict setting keeps working.
  location /api/ {
    proxy_pass http://api:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Report PDFs and wide CSV exports can take a while to generate.
    proxy_read_timeout 120s;
  }

  # Catalogue photography, proxied rather than copied into this image: the
  # pictures are content the importer maintains, not build output, and serving
  # them from the site's own origin is what keeps `img-src 'self'` above true.
  # The API sets its own year-long immutable Cache-Control on each file.
  location /media/ {
    proxy_pass http://api:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /realtime {
    proxy_pass http://api:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }

  location /health {
    proxy_pass http://api:5000/health;
  }

  # Client-side routing: an unknown path is a route, not a missing file.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
