<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pharmaceutical distribution for wholesalers, pharmacies and delivery teams." />
    <meta name="theme-color" content="#126b45" />
    <title>MedSupply B2B</title>

    <!--
      The boot screen, and why it is written here in plain CSS.

      Everything else this application shows — the stylesheet, the design
      tokens, the word "loading" in two languages — arrives through the module
      graph that starts at `/src/main.tsx`. So when that graph fails to
      evaluate, none of it is available, `#root` is never touched, and the
      browser paints white with the reason in a console nobody has open.

      That has now happened twice. Once when the shared packages resolved to
      their CommonJS `dist` and every page died on `does not provide an export
      named 'UserRole'`, and once on a dev server holding a stale transform of
      `packages/i18n/en.ts`. Both were reported the same way: "the system is
      showing a white blank page."

      These rules are therefore deliberately duplicated rather than shared with
      `index.css`: a fallback that imports the thing it is covering for is not
      a fallback.
    -->
    <style>
      #app-boot {
        position: fixed;
        inset: 0;
        z-index: 400;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 0.75rem;
        padding: 1.5rem;
        margin: 0 auto;
        max-width: 34rem;
        font-family: ui-sans-serif, system-ui, 'Segoe UI', Roboto, Arial, sans-serif;
        line-height: 1.5;
        color: #1c2024;
        background: #ffffff;
      }
      #app-boot h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 600;
      }
      #app-boot p {
        margin: 0;
        color: #52606d;
      }
      #app-boot pre {
        margin: 0;
        padding: 0.75rem;
        overflow-x: auto;
        border: 1px solid #d7dce1;
        border-radius: 0.375rem;
        background: #f4f6f8;
        font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
        font-size: 0.8125rem;
        color: #1c2024;
      }
      #app-boot button {
        align-self: flex-start;
        padding: 0.5rem 1rem;
        border: 1px solid transparent;
        border-radius: 0.375rem;
        background: #126b45;
        color: #ffffff;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      #app-boot button:hover {
        background: #0e5637;
      }
      #app-boot button:focus-visible {
        outline: 2px solid #126b45;
        outline-offset: 2px;
      }
      @media (prefers-color-scheme: dark) {
        #app-boot {
          color: #eef1f4;
          background: #14181c;
        }
        #app-boot p {
          color: #a6b0bb;
        }
        #app-boot pre {
          border-color: #2b3138;
          background: #1c2126;
          color: #eef1f4;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Outside `#root`, not inside it. `expectPageRendered` in the browser suite
      fails a page whose `#root` has no text in it, which is the assertion that
      catches the blank page in the first place — putting the fallback in there
      would have handed that gate its own words to read and switched it off.
    -->
    <div id="app-boot" role="status" aria-live="polite">
      <p>Starting MedSupply B2B…</p>
    </div>

    <script>
      /*
       * Turns a failure to load into a sentence.
       *
       * A classic script, not a module, and before the module tag: it has to
       * run even when nothing else does. It only ever speaks while `#app-boot`
       * is still on the page — once React has mounted, `main.tsx` removes the
       * node and `ErrorBoundary` owns every failure after that.
       *
       * Deliberately not translated. The catalogue is part of the module graph
       * this exists to cover for, so reaching for it here would be reaching for
       * the thing that just failed.
       */
      (function () {
        var SLOW_AFTER_MS = 20000;
        var spoken = false;

        function boot() {
          return document.getElementById('app-boot');
        }

        function say(title, body, detail) {
          var node = boot();
          // Gone means React mounted. Anything failing after that is the error
          // boundary's to report, and speaking over it would be worse.
          if (!node || spoken) return;
          spoken = true;
          node.setAttribute('role', 'alert');
          node.textContent = '';

          var heading = document.createElement('h1');
          heading.textContent = title;
          node.appendChild(heading);

          var explanation = document.createElement('p');
          explanation.textContent = body;
          node.appendChild(explanation);

          if (detail) {
            var reported = document.createElement('p');
            reported.textContent = 'What the browser reported:';
            node.appendChild(reported);
            // `textContent`, never `innerHTML`: this string comes from the
            // browser and can carry a URL or a fragment of source.
            var technical = document.createElement('pre');
            technical.textContent = detail;
            node.appendChild(technical);
          }

          var retry = document.createElement('button');
          retry.type = 'button';
          retry.textContent = 'Try again';
          retry.addEventListener('click', function () {
            window.location.reload();
          });
          node.appendChild(retry);
        }

        function failed(detail) {
          say(
            'MedSupply B2B could not start',
            'The application did not finish loading, so none of it is on screen. This is ' +
              'usually a temporary problem with the connection or with the server it comes from.',
            detail,
          );
        }

        // Capture, because a script that fails to load fires `error` on the
        // element and that event does not bubble.
        window.addEventListener(
          'error',
          function (event) {
            if (event.target && event.target !== window && event.target.tagName === 'SCRIPT') {
              failed('The application code could not be downloaded.');
              return;
            }
            failed(event.message || String(event.error || 'An unknown error.'));
          },
          true,
        );

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          failed((reason && (reason.message || String(reason))) || 'An unknown error.');
        });

        window.setTimeout(function () {
          say(
            'This is taking longer than usual',
            'The application is still loading. If nothing appears, try again — and if it keeps ' +
              'happening, tell whoever looks after this system.',
          );
        }, SLOW_AFTER_MS);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
