name: CI

# Every check the definition of done requires, run on the runtime the
# deployment documents. The workstation this was developed on runs Node 24 and
# a Turbo wrapper that fails there, so the pipeline is what proves the project
# builds on Node 20 LTS.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.0.0'

jobs:
  verify:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Hand-listed rather than driven by turbo, so a new package is invisible
      # here until it is added. `pipelineWiring.test.ts` reconciles this file
      # against the workspace and fails the build when a package defines a
      # gated script that no step below runs — which is how all five
      # `packages/*` went unchecked here for twelve phases.
      - name: Build shared packages
        run: |
          pnpm --filter @medsupply/shared-types build
          pnpm --filter @medsupply/utilities build
          pnpm --filter @medsupply/validation build
          pnpm --filter @medsupply/design-tokens build
          pnpm --filter @medsupply/navigation build
          pnpm --filter @medsupply/api-client build
          pnpm --filter @medsupply/config build
          pnpm --filter @medsupply/constants build

      # `pnpm --filter X <script>` exits 0 when the script does not exist, so a
      # missing script reads as a passing step. That is how the mobile app —
      # 67 files — went unchecked here for twelve phases. `run` errors instead,
      # so deleting or renaming a script fails the build rather than silently
      # removing a gate.
      - name: Typecheck
        run: |
          pnpm --filter @medsupply/shared-types run typecheck
          pnpm --filter @medsupply/utilities run typecheck
          pnpm --filter @medsupply/validation run typecheck
          pnpm --filter @medsupply/design-tokens run typecheck
          pnpm --filter @medsupply/navigation run typecheck
          pnpm --filter @medsupply/api-client run typecheck
          pnpm --filter @medsupply/config run typecheck
          pnpm --filter @medsupply/constants run typecheck
          pnpm --filter @medsupply/api run typecheck
          pnpm --filter @medsupply/web run typecheck
          pnpm --filter @medsupply/mobile run typecheck

      - name: Lint
        run: |
          pnpm --filter @medsupply/api run lint
          pnpm --filter @medsupply/web run lint
          pnpm --filter @medsupply/mobile run lint

      - name: API unit tests
        run: pnpm --filter @medsupply/api test

      # The transactional suites need a replica set. `mongodb-memory-server`
      # starts a real one-node replica set, which is what the transactions in
      # approval, packing, delivery, payment and returns are verified against.
      - name: API integration tests
        run: pnpm --filter @medsupply/api test:integration

      - name: Web tests
        run: pnpm --filter @medsupply/web test

      - name: Mobile tests
        run: pnpm --filter @medsupply/mobile test

      - name: Production builds
        run: |
          pnpm --filter @medsupply/api build
          pnpm --filter @medsupply/web build

      - name: Validate deployment configuration
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.prod.yml config >/dev/null
        env:
          JWT_SECRET: ci-placeholder-secret-at-least-32-characters
          REFRESH_TOKEN_SECRET: ci-placeholder-refresh-at-least-32-characters
          REDIS_PASSWORD: ci-placeholder

      # Everything above stops at the module boundary. These two steps are the
      # gap the blank page and the unstartable dev server lived in: nothing had
      # ever booted either application and asked whether it worked.
      - name: The dev server starts
        run: |
          set -euo pipefail
          pnpm --filter @medsupply/web dev --port 5199 --host 127.0.0.1 --strictPort > /tmp/web-dev.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5199/ > /tmp/web-dev.html; then break; fi
            sleep 1
          done
          grep -q '<div id="root"' /tmp/web-dev.html || { echo 'The dev server never served the app shell:'; cat /tmp/web-dev.log; exit 1; }

      - name: The built bundle serves the app shell
        run: |
          set -euo pipefail
          pnpm --filter @medsupply/web preview --port 4199 --host 127.0.0.1 --strictPort > /tmp/web-preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4199/ > /tmp/web-preview.html; then break; fi
            sleep 1
          done
          grep -q '<div id="root"' /tmp/web-preview.html || { echo 'The built bundle never served the app shell:'; cat /tmp/web-preview.log; exit 1; }

  # Boots both applications in a browser against a real database and drives
  # them as a person would. This is the suite that catches a page that renders
  # nothing, a role that cannot sign in, and a dialog that silently cancels the
  # action it claims to confirm.
  browser:
    name: End-to-end in a browser
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30

    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @medsupply/shared-types build
          pnpm --filter @medsupply/utilities build
          pnpm --filter @medsupply/validation build
          pnpm --filter @medsupply/design-tokens build
          pnpm --filter @medsupply/navigation build
          pnpm --filter @medsupply/api-client build
          pnpm --filter @medsupply/config build
          pnpm --filter @medsupply/constants build

      # The transactions the seed drives need a replica set, so a single-node
      # `mongo` service container is not enough.
      - name: Start MongoDB as a replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:6.0 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 60); do
            if docker exec mongo mongosh --quiet --eval 'db.adminCommand("ping")' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in $(seq 1 60); do
            if docker exec mongo mongosh --quiet --eval 'rs.status().ok' | grep -q 1; then break; fi
            sleep 2
          done

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the browser suites
        run: pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built but not pushed: this proves the Dockerfiles work without this
      # workflow needing registry credentials.
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
