name: CI

# Every check the definition of done requires, run on the runtime the
# deployment documents. The workstation this was developed on runs Node 24 and
# a Turbo wrapper that fails there, so the pipeline is what proves the project
# builds on Node 20 LTS.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.0.0'

jobs:
  verify:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @medsupply/shared-types build
          pnpm --filter @medsupply/validation build

      # `pnpm --filter X <script>` exits 0 when the script does not exist, so a
      # missing script reads as a passing step. That is how the mobile app —
      # 67 files — went unchecked here for twelve phases. `run` errors instead,
      # so deleting or renaming a script fails the build rather than silently
      # removing a gate.
      - name: Typecheck
        run: |
          pnpm --filter @medsupply/api run typecheck
          pnpm --filter @medsupply/web run typecheck
          pnpm --filter @medsupply/mobile run typecheck

      - name: Lint
        run: |
          pnpm --filter @medsupply/api run lint
          pnpm --filter @medsupply/web run lint
          pnpm --filter @medsupply/mobile run lint

      - name: API unit tests
        run: pnpm --filter @medsupply/api test

      # The transactional suites need a replica set. `mongodb-memory-server`
      # starts a real one-node replica set, which is what the transactions in
      # approval, packing, delivery, payment and returns are verified against.
      - name: API integration tests
        run: pnpm --filter @medsupply/api test:integration

      - name: Web tests
        run: pnpm --filter @medsupply/web test

      - name: Mobile tests
        run: pnpm --filter @medsupply/mobile test

      - name: Production builds
        run: |
          pnpm --filter @medsupply/api build
          pnpm --filter @medsupply/web build

      - name: Validate deployment configuration
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.prod.yml config >/dev/null
        env:
          JWT_SECRET: ci-placeholder-secret-at-least-32-characters
          REFRESH_TOKEN_SECRET: ci-placeholder-refresh-at-least-32-characters
          REDIS_PASSWORD: ci-placeholder

  images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built but not pushed: this proves the Dockerfiles work without this
      # workflow needing registry credentials.
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
