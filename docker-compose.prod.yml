# Production-shaped deployment.
#
# `docker-compose.yml` runs the development backing services with open ports and
# default credentials. This file builds and runs the applications themselves,
# publishes nothing but the web tier, and takes every secret from the
# environment so none of them lives in the repository.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# MongoDB runs as a replica set because the transactional guarantees this system
# relies on — a payment and its ledger entry, a packing run and its invoice —
# require multi-document transactions, which a standalone server cannot provide.

services:
  mongodb:
    image: mongo:6.0
    environment:
      # Creates the root account on the first start, while the data directory is
      # still empty. It exists to administer the server; the API does not use it.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: medsupply_b2b
      # Read by init-app-user.js below to create the least-privilege account the
      # application actually connects with.
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?set MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD}
      MONGO_KEYFILE: ${MONGO_KEYFILE:?set MONGO_KEYFILE - see docs/DEPLOYMENT.md}
    # A replica set with authentication enabled also needs internal
    # member-to-member authentication, which means a keyfile. The keyfile is
    # written inside the container rather than bind-mounted, because mongod
    # refuses to start when the keyfile is group- or world-readable and a bind
    # mount cannot be given 0400 mongodb:mongodb from a Windows or macOS host:
    # the file arrives owned by root with the mount's permissions and the server
    # exits before it logs anything that names the real cause.
    #
    # `command` overrides CMD, not ENTRYPOINT, so this runs as
    # `docker-entrypoint.sh bash -c ...`. The entrypoint only performs its
    # first-run setup when its first argument is `mongod`, so it passes straight
    # through to this shell as root -- which is what allows the chown -- and the
    # explicit re-entry on the last line is what runs the root-user creation and
    # the scripts in docker-entrypoint-initdb.d.
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        printf '%s' "$$MONGO_KEYFILE" > /run/mongo-keyfile
        chmod 400 /run/mongo-keyfile
        chown mongodb:mongodb /run/mongo-keyfile
        exec docker-entrypoint.sh mongod \
          --replSet rs0 --bind_ip_all --auth --keyFile /run/mongo-keyfile
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongodb/init-app-user.js:/docker-entrypoint-initdb.d/init-app-user.js:ro
    healthcheck:
      # Now authenticated. Without credentials this returns an auth error rather
      # than an uninitialised replica set, the container never reports healthy,
      # and `depends_on: service_healthy` holds the API back with a message that
      # names nothing -- so the credentials belong here as much as in the URI.
      test:
        [
          'CMD',
          'bash',
          '-c',
          'mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongodb:27017\"}]}).ok }"',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    # Not published: only the API needs to reach it.
    expose:
      - '27017'

  redis:
    image: redis:7.0-alpine
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD:?set REDIS_PASSWORD}',
        '--appendonly',
        'yes',
      ]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    expose:
      - '6379'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: '5000'
      # The application connects as the least-privilege account, never as root.
      # `authSource=admin` because that is where MongoDB stores every user
      # record regardless of which database the account has rights over.
      MONGODB_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongodb:27017/medsupply_b2b?replicaSet=rs0&authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to at least 32 characters}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?set REFRESH_TOKEN_SECRET to at least 32 characters}
      # One proxy in front: the nginx container below.
      TRUST_PROXY_HOPS: '1'
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MEDIA_ROOT: /app/var/media
    volumes:
      # Catalogue photography. A named volume rather than part of the image
      # because the pictures outlive any one build and are refilled by the
      # importer, not by a deploy — rebuilding the image must not empty the
      # catalogue.
      - media_data:/app/var/media
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    expose:
      - '5000'
    # The graceful shutdown in server.ts needs longer than Docker's ten-second
    # default to drain in-flight transactions.
    stop_grace_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Same origin as the site, so the browser makes no cross-site request
        # and the SameSite=Strict refresh cookie is delivered.
        VITE_API_URL: /api/v1
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
  media_data:
